version: '3'

vars:
  REGISTRY: '{{.REGISTRY | default "8gcr.container-registry.dev/oci-native"}}'
  ENGINE:
    sh: command -v podman || command -v docker
  APPS:
    sh: ls containers

tasks:
  default:
    silent: true
    cmds:
      - task --list

  build:*:
    desc: Build one app image; tag comes from its cask version
    vars:
      APP: '{{index .MATCH 0}}'
      VERSION: &cask-version
        sh: sed -n 's/^ *version "\(.*\)"$/\1/p' "$(find Casks -name '{{.APP}}.rb' -print -quit)"
    preconditions:
      - sh: test -f 'containers/{{.APP}}/Containerfile'
        msg: 'no containers/{{.APP}}/Containerfile'
      - sh: test -n '{{.VERSION}}'
        msg: 'no cask version found for {{.APP}}'
    cmds:
      - |
        context=$(mktemp -d)
        trap 'rm -rf "$context"' EXIT
        cp 'containers/{{.APP}}/Containerfile' "$context/"
        # A Containerfile that copies cask.deb gets the cask's own
        # artifact, brew-fetched and sha256-verified.
        if grep -q '^COPY cask.deb' 'containers/{{.APP}}/Containerfile'; then
          brew fetch --cask 'oci-native/pkgs/{{.APP}}'
          cp "$(brew --cache --cask 'oci-native/pkgs/{{.APP}}')" "$context/cask.deb"
        fi
        # BUILD_CACHE=1 shares layers through the registry (podman only),
        # so ephemeral CI runners reuse layers from previous runs.
        cache_args=""
        if [ -n "${BUILD_CACHE:-}" ] && [ "$(basename '{{.ENGINE}}')" = podman ]; then
          cache_args="--layers --cache-from={{.REGISTRY}}/cache/{{.APP}} --cache-to={{.REGISTRY}}/cache/{{.APP}} --cache-ttl=168h"
        fi
        {{.ENGINE}} build $cache_args --build-arg 'APP_VERSION={{.VERSION}}' \
          -t '{{.REGISTRY}}/{{.APP}}:{{.VERSION}}' \
          -t '{{.REGISTRY}}/{{.APP}}:latest' "$context"

  push:*:
    desc: Build and push one app image
    vars:
      APP: '{{index .MATCH 0}}'
      VERSION: *cask-version
    cmds:
      - task: 'build:{{.APP}}'
      - '{{.ENGINE}} push {{.REGISTRY}}/{{.APP}}:{{.VERSION}}'
      - '{{.ENGINE}} push {{.REGISTRY}}/{{.APP}}:latest'

  build-all:
    desc: Build every app image
    cmds:
      - for: {var: APPS}
        task: 'build:{{.ITEM}}'

  push-all:
    desc: Build and push every app image
    cmds:
      - for: {var: APPS}
        task: 'push:{{.ITEM}}'

  lint:
    desc: Run brew style across the tap
    cmds:
      - brew style --cask oci-native/pkgs

  audit:
    desc: Run brew audit across the tap
    cmds:
      - brew audit --tap oci-native/pkgs
