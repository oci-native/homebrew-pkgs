name: Renovate base images

# Self-hosted Renovate scoped to the dockerfile manager: bumps FROM tags
# in containers/*/Containerfile. App versions stay with the brew autobump
# workflow. Needs secret RENOVATE_TOKEN (classic PAT, repo scope) - the
# built-in GITHUB_TOKEN is not supported by Renovate.

on:
  schedule:
    # Weekly, Monday 05:23 UTC
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate-base-images
  cancel-in-progress: false

jobs:
  renovate:
    if: github.repository == 'oci-native/homebrew-pkgs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: renovatebot/github-action@v46
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: oci-native/homebrew-pkgs
          RENOVATE_ONBOARDING: 'false'
          LOG_LEVEL: info
