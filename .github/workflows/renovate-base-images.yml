name: Renovate base images

# Self-hosted Renovate scoped to the dockerfile manager: bumps FROM tags
# in containers/*/Containerfile. App versions stay with the brew autobump
# workflow. Runs on the built-in GITHUB_TOKEN as the github-actions bot;
# the username and git author are set explicitly because the token has no
# user identity for Renovate to look up. Known trade-off: PRs opened by
# GITHUB_TOKEN do not trigger other workflows.

on:
  schedule:
    # Weekly, Monday 05:23 UTC
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: renovate-base-images
  cancel-in-progress: false

jobs:
  renovate:
    if: github.repository == 'oci-native/homebrew-pkgs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: renovatebot/github-action@v46
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: oci-native/homebrew-pkgs
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_USERNAME: github-actions[bot]
          RENOVATE_GIT_AUTHOR: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          LOG_LEVEL: info
