name: Publish OCI images

# Optional: users build images locally from the tap's Containerfiles by
# default. This workflow seeds a registry for OCI_NATIVE_REGISTRY users,
# re-publishing whenever a cask bump or Containerfile change lands on
# main. Configure repository variable REGISTRY (defaults to the org
# registry) and secrets REGISTRY_USER / REGISTRY_PASSWORD first.

on:
  push:
    branches: [main]
    paths:
      - 'Casks/**'
      - 'containers/**'
      - 'scripts/publish-image.sh'
  workflow_dispatch:
    inputs:
      app:
        description: App to build (containers/<app>); empty builds all
        required: false

permissions:
  contents: read

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGISTRY: ${{ vars.REGISTRY || '8gcr.container-registry.dev/oci-native' }}
    steps:
      - uses: actions/checkout@v4
      - name: Tap this checkout
        run: brew tap oci-native/pkgs "$GITHUB_WORKSPACE"
      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | podman login "${REGISTRY%%/*}" -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      - name: Build and push
        env:
          APP: ${{ inputs.app }}
        run: |
          if [[ -n "${APP-}" ]]; then
            ./scripts/publish-image.sh "$APP" --push
          else
            for dir in containers/*/; do
              ./scripts/publish-image.sh "$(basename "$dir")" --push
            done
          fi
