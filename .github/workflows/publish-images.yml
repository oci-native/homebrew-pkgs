name: Publish OCI images

# Launchers pull from this registry first and only build locally as a
# fallback, so this workflow is the primary image supply: it republishes
# whenever a cask bump or Containerfile change lands on main, and a
# 3-hourly cron rebuilds everything so refreshed base images and newly
# merged bumps reach users quickly. Each pushed image is cosign-signed
# (keyless, GitHub OIDC), the signature is verified, and the signed
# digest is committed back into the cask, where launchers pull by
# digest with the version kept as a side comment. Configure repository
# variable REGISTRY (defaults to the org registry) and secrets
# REGISTRY_USER / REGISTRY_PASSWORD first.

on:
  push:
    branches: [main]
    paths:
      - 'Casks/**'
      - 'containers/**'
      - 'Taskfile.yml'
  schedule:
    - cron: '30 */3 * * *'
  workflow_dispatch:
    inputs:
      app:
        description: App to build (containers/<app>); empty builds all
        required: false

permissions:
  contents: write # pin signed digests back into the casks
  id-token: write # cosign keyless signing

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REGISTRY: ${{ vars.REGISTRY || '8gcr.container-registry.dev/oci-native' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Tap this checkout
        run: brew tap oci-native/pkgs "$GITHUB_WORKSPACE"
      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | podman login "${REGISTRY%%/*}" -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      - name: Release (push, sign, verify, pin digests)
        env:
          APP: ${{ inputs.app }}
          BUILD_CACHE: '1'
        run: |
          if [[ -n "${APP-}" ]]; then
            task "release:$APP"
          else
            task release-all
          fi
      - name: Commit pinned digests
        run: |
          if git diff --quiet -- Casks; then
            echo "digests unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks
          git commit -m "chore: pin signed image digests [skip ci]"
          git push origin HEAD:main
