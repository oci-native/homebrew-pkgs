name: Publish OCI images

# Launchers pull from this registry first and only build locally as a
# fallback, so this workflow is the primary image supply: it republishes
# whenever a cask bump or Containerfile change lands on main, and a
# 3-hourly cron rebuilds everything so refreshed base images and newly
# merged bumps reach users quickly. Every image tag is the cask version,
# and the payload inside is the same sha256-verified artifact the cask
# pins. Configure repository variable REGISTRY (defaults to the org
# registry) and secrets REGISTRY_USER / REGISTRY_PASSWORD first.

on:
  push:
    branches: [main]
    paths:
      - 'Casks/**'
      - 'containers/**'
      - 'Taskfile.yml'
  schedule:
    - cron: '30 */3 * * *'
  workflow_dispatch:
    inputs:
      app:
        description: App to build (containers/<app>); empty builds all
        required: false

permissions:
  contents: read

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGISTRY: ${{ vars.REGISTRY || '8gcr.container-registry.dev/oci-native' }}
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          version: 3
      - name: Tap this checkout
        run: brew tap oci-native/pkgs "$GITHUB_WORKSPACE"
      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | podman login "${REGISTRY%%/*}" -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      - name: Build and push
        env:
          APP: ${{ inputs.app }}
          BUILD_CACHE: '1'
        run: |
          if [[ -n "${APP-}" ]]; then
            task "push:$APP"
          else
            task push-all
          fi
