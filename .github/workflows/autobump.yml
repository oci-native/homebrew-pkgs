name: Bump casks on schedule or request

on:
  workflow_dispatch:
    inputs:
      casks:
        description: Custom list of casks to livecheck and bump if outdated
        required: false
  schedule:
    # Daily at 06:23 UTC
    - cron: '23 6 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autobump
  cancel-in-progress: false

jobs:
  autobump:
    if: github.repository == 'oci-native/homebrew-pkgs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/homebrew/brew:latest
    env:
      HOMEBREW_DEVELOPER: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ENV_HINTS: 1
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_GIT_COMMITTER_NAME: ${{ github.actor }}
      HOMEBREW_GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
    steps:
      - name: Configure Git user
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Tap this repository
        run: brew tap oci-native/pkgs https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/oci-native/homebrew-pkgs

      - name: Bump casks
        env:
          CASKS: ${{ inputs.casks }}
        run: |
          BREW_BUMP=(brew bump --no-fork --open-pr --casks)
          if [[ -n "${CASKS-}" ]]; then
            xargs "${BREW_BUMP[@]}" <<<"${CASKS}"
          else
            "${BREW_BUMP[@]}" --auto --tap=oci-native/pkgs
          fi
